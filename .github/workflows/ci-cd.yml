name: SRE CI/CD Pipeline (Test • Docker • Terraform • Security)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    name: 1. Automated Unit & SRE Probe Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest suite
        run: python3 -m unittest discover -s tests -v

  docker-build-and-smoke-test:
    name: 2. Docker Build & Container Healthcheck Smoke Test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened Docker image
        run: docker build -t sre-cloud-observability:ci .
      - name: Run container & verify /health + /metrics
        run: |
          docker run -d --name sre-smoke -p 8080:8080 sre-cloud-observability:ci
          sleep 3
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/metrics | grep -q "app_sli_availability_ratio"
          docker stop sre-smoke

  terraform-validate:
    name: 3. Terraform IaC Format & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init (backend=false) & Validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive || true
          terraform init -backend=false
          terraform validate
