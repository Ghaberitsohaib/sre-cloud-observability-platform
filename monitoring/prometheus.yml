global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "sre-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["sre-app:8080"]
        labels:
          service: "sre-cloud-observability-platform"
          env: "production"
